
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Een interactieve puzzelvertelling waarin elk antwoord je verder brengt.">
  <title>Het Puzzelverhaal</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #171b24;
      color: #f4efe5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      max-width: 650px;
      text-align: center;
      padding: 40px 24px;
    }

    .label {
      color: #c7a66a;
      text-transform: uppercase;
      letter-spacing: 3px;
      font: 12px Arial, sans-serif;
    }

    h1 {
      font-size: clamp(36px, 7vw, 58px);
      font-weight: normal;
      margin: 24px 0;
    }

    p {
      color: #d1d2d7;
      font: 17px/1.8 Arial, sans-serif;
    }

    button {
      margin-top: 24px;
      padding: 15px 28px;
      border: 0;
      background: #c7a66a;
      color: #171b24;
      font-size: 16px;
      cursor: pointer;
      border-radius: 3px;
    }

    button:hover {
      background: #e0c58f;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Een interactief mysterie</div>
    <h1>Elk antwoord brengt je verder.</h1>
    <p>
      Er is een verhaal dat verteld wil worden.
      Maar niet alles wordt zomaar prijsgegeven.
      Kijk goed, denk na en ontdek wat er achter
      de volgende deur verborgen ligt.
    </p>
    <button onclick="alert('Het avontuur begint binnenkort.')">
      Begin het avontuur
    </button>
  </main>
</body>
</html>
